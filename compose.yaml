
services:
  api:
    build: .
    container_name: devtrack-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://devtrack_user:devtrack_password@db:5432/devtrack
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: devtrack-db
    environment:
      POSTGRES_USER: devtrack_user
      POSTGRES_PASSWORD: devtrack_password
      POSTGRES_DB: devtrack
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrack_user -d devtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
